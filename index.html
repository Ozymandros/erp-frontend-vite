<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ERP Admin Portal - Manage users, roles, inventory, orders, and purchasing operations" />
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: dark)" />
    <title>ERP Admin Portal</title>
    <script>
      (function () {
        try {
          var storageKey = "vite-ui-theme";
          var theme = "system";
          try {
            theme = localStorage.getItem(storageKey) || "system";
          } catch (storageError) {
            theme = "system";
          }
          var root = document.documentElement;
          var prefersDark = false;
          try {
            prefersDark = window
              .matchMedia("(prefers-color-scheme: dark)")
              .matches;
          } catch (mediaError) {
            prefersDark = false;
          }
          var isDark =
            theme === "dark" || (theme === "system" && prefersDark);
          root.classList.remove("light", "dark");
          root.classList.add(isDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-primary focus:text-primary-foreground focus:px-4 focus:py-2 focus:rounded-md">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
